<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4cc3ff" />
    <meta name="description" content="BUS COLOR JAM - park the colourful buses, match the passengers and clear the traffic jam! A free original bus sorting puzzle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="BUS COLOR JAM" />
    <meta property="og:description" content="Park buses, match passengers, clear the jam. 200 levels of colourful puzzle fun!" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>BUS COLOR JAM</title>
  </head>
  <body>
    <!-- Splash: 1) RJ GAMES logo, then 2) BUS COLOR JAM artwork, then a fade-out onto the game (see BootScene) -->
    <div id="boot-splash">
      <div class="slide rj"><img class="logo" src="/assets/rj_splash.jpg" alt="RJ GAMES" draggable="false" /></div>
      <div class="slide bcj">
        <img class="logo" src="/assets/bcj_splash.jpg" alt="BUS COLOR JAM" draggable="false" />
        <div class="loadbar"><div class="fill"></div><span class="pct">LOADING 0%</span></div>
      </div>
    </div>
    <script>window.__splashT0 = Date.now();</script>
    <div id="game-root"></div>
    <noscript>BUS COLOR JAM needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
