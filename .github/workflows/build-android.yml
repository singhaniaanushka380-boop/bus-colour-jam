name: Build Signed AdMob Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4689051548603672~5150767123"\/>\n    <\/application>/g' $MANIFEST

      - name: Auto-Increment Version Code & Name
        run: |
          GRADLE="android/app/build.gradle"
          VER_CODE=$((GITHUB_RUN_NUMBER + 10))
          sed -i "s/versionCode 1/versionCode $VER_CODE/g" $GRADLE
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VER_CODE\"/g" $GRADLE

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/signing.keystore"

      - name: Build Signed Release APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/signing.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Signed APK & AAB Files
        uses: actions/upload-artifact@v4
        with:
          name: BusColorJam-Signed-AdMob
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Auto-Push APK to itch.io
        uses: josephbmanley/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: android
          ITCH_GAME: rajat-verma1555/bus-color-jam
          ITCH_USER: rajat-verma1555
          PACKAGE: android/app/build/outputs/apk/release/app-release.apk
