name: Build Signed AdMob Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4689051548603672~5150767123"\/>\n    <\/application>/g' $MANIFEST

      - name: Auto-Increment Version Code & Name
        run: |
          GRADLE="android/app/build.gradle"
          VER_CODE=$((GITHUB_RUN_NUMBER + 10))
          sed -i "s/versionCode 1/versionCode $VER_CODE/g" $GRADLE
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VER_CODE\"/g" $GRADLE

      - name: Remove Android system splash (app icon) - the game shows its own RJ GAMES splash
        run: |
          RES="android/app/src/main/res"
          mkdir -p "$RES/values"
          # dark purple = same colour as the edge of the RJ GAMES splash, so the start looks seamless
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="rj_splash_bg">#030120</color></resources>' > "$RES/values/rj_splash_colors.xml"
          python3 - <<'PY'
          import re, sys
          path = "android/app/src/main/res/values/styles.xml"
          s = open(path, encoding="utf-8").read()
          m = re.search(r'<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', s, re.S)
          if not m:
              print("WARNING: launch style not found, system splash left unchanged"); sys.exit(0)
          block = m.group(0)
          # drop whatever the template had for splash pictures / splash icon, then set our own
          block = re.sub(r'\s*<item name="android:background">.*?</item>', '', block, flags=re.S)
          block = re.sub(r'\s*<item name="(android:)?windowSplashScreen\w*">.*?</item>', '', block, flags=re.S)
          items = (
              '\n        <item name="android:background">@color/rj_splash_bg</item>'
              '\n        <item name="android:windowSplashScreenBackground">@color/rj_splash_bg</item>'
              '\n        <item name="android:windowSplashScreenAnimatedIcon">@android:color/transparent</item>'
          )
          if "Theme.SplashScreen" in block:  # androidx splash theme (Capacitor 6 default)
              items += (
                  '\n        <item name="windowSplashScreenBackground">@color/rj_splash_bg</item>'
                  '\n        <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>'
              )
          block = block.replace("</style>", items + "\n    </style>")
          open(path, "w", encoding="utf-8").write(s.replace(m.group(0), block))
          print("---- styles.xml after change ----")
          print(open(path, encoding="utf-8").read())
          PY

      - name: Allow phone vibration (Settings > Vibration)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.VIBRATE" "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$MANIFEST"
          grep -n "VIBRATE" "$MANIFEST"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/signing.keystore"

      - name: Build Signed Release APK & AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/signing.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Signed APK & AAB Files
        uses: actions/upload-artifact@v4
        with:
          name: BusColorJam-Signed-AdMob
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish Direct Download Link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Bus Color Jam Latest Android APK
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
