name: Build AdMob Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Inject AdMob App ID into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<\/application>/        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4689051548603672~5150767123"\/>\n    <\/application>/g' $MANIFEST

      - name: Update Version Code & Name
        run: |
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode 1/versionCode 3/g' $GRADLE
          sed -i 's/versionName "1.0"/versionName "1.0.2"/g' $GRADLE

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK & AAB Files
        uses: actions/upload-artifact@v4
        with:
          name: BusColorJam-AdMob-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
